---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: release

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Generate token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.TOKEN_EXCHANGE_APP }}
          private-key: ${{ secrets.TOKEN_EXCHANGE_KEY }}
          permission-contents: write

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Install tools
        uses: jdx/mise-action@v5

      - name: Cache yarn
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          path: |
            ~/.yarn/berry/cache
            .yarn/install-state.gz
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Run install
        run: yarn install --immutable

      - name: Run typecheck
        run: yarn tsc

      - name: Run build
        run: yarn build:all

      - name: Git config
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github@cloudpunks.de"

      - name: Run release
        run: semrel workspace release
        env:
          SEMREL_PLUGIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync sources
        run: git pull --autostash --rebase && git push

...
