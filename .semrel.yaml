---
# yaml-language-server: $schema=https://registry.semrel.io/schemas/core/v1.json
schemaVersion: 1

branches:
  - name: master

rules:
  - type: feat
    bump: minor
  - type: fix
    bump: patch
  - type: perf
    bump: patch
  - type: revert
    bump: patch
  - type: deps
    bump: patch

plugins:
  - uses: "@semrel/provider-github"
  - uses: "@semrel/generator-changelog-md"
  - uses: "@semrel/updater-npm"
  - uses: "@semrel/publisher-npm"
    args:
      provenance: "true"
      access: "public"

workspace:
  strategy: independent

  sharedPaths:
    - tsconfig.json

  ignorePaths:
    - "**/*.md"
    - "**/*.test.ts"
    - "**/*.test.tsx"

  packages:
    - path: plugins/catalog-kubeconfig-fetcher
      tagPrefix: catalog-kubeconfig-fetcher-
    - path: plugins/kubernetes-versions-backend
      tagPrefix: kubernetes-versions-backend-
    - path: plugins/scaffolder-kubernetes-versions
      tagPrefix: scaffolder-kubernetes-versions-

...
