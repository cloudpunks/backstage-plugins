---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: general

"on":
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install tools
        uses: jdx/mise-action@v4

      - name: Cache yarn
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          path: |
            ~/.yarn/berry/cache
            .yarn/install-state.gz
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Run install
        run: yarn install --immutable

      - name: Run typecheck
        run: yarn tsc:full

      - name: Run config
        run: yarn config:all

      - name: Run lint
        run: yarn lint:all

      - name: Run prettier
        run: yarn prettier:check

      - name: Run build
        run: yarn build:all

      - name: Run tests
        run: yarn test:all

...
